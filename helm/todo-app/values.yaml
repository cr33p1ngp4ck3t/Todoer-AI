replicaCount: 3

image:
  backend:
    repository: your-registry/todo-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: your-registry/todo-frontend
    tag: latest
    pullPolicy: IfNotPresent

service:
  type: ClusterIP
  backend:
    port: 8000
  frontend:
    port: 3000

ingress:
  enabled: true
  className: nginx
  host: todo.example.com
  tls: true
  certIssuer: letsencrypt-prod

backendSecrets:
  # Existing Secret containing DATABASE_URL, SECRET_KEY, and SESSION_SECRET.
  existingSecret: todo-backend-secrets

kafka:
  enabled: true
  brokers: "kafka:9092"

dapr:
  enabled: true
  pubsubName: "todo-pubsub"
  stateStoreName: "todo-statestore"

resources:
  backend:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  frontend:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m

autoscaling:
  backend:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  frontend:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
