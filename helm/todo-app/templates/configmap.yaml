apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todo-app.fullname" . }}-backend-config
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
data:
  HOST: "0.0.0.0"
  PORT: "8000"
  DEBUG: "false"
  FRONTEND_URL: "{{ if .Values.ingress.tls }}https{{ else }}http{{ end }}://{{ .Values.ingress.host }}"
  CORS_ORIGINS: "{{ if .Values.ingress.tls }}https{{ else }}http{{ end }}://{{ .Values.ingress.host }}"
  DEFAULT_LLM_PROVIDER: "groq"
  {{- if .Values.kafka.enabled }}
  KAFKA_BROKERS: "{{ .Values.kafka.brokers }}"
  {{- end }}
  {{- if .Values.dapr.enabled }}
  DAPR_PUBSUB_NAME: "{{ .Values.dapr.pubsubName }}"
  DAPR_STATESTORE_NAME: "{{ .Values.dapr.stateStoreName }}"
  {{- end }}
