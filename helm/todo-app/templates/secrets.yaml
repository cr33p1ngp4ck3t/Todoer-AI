apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.fullname" . }}-backend-secrets
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.database.user }}:$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_USE_KMS_OR_VAULT"
  SESSION_SECRET: "CHANGE_ME_IN_PRODUCTION"
  GROQ_API_KEY: "your-groq-api-key"
  GEMINI_API_KEY: "your-gemini-api-key"
  GOOGLE_CLIENT_ID: "your-google-client-id"
  GOOGLE_CLIENT_SECRET: "your-google-client-secret"
  GITHUB_CLIENT_ID: "your-github-client-id"
  GITHUB_CLIENT_SECRET: "your-github-client-secret"
