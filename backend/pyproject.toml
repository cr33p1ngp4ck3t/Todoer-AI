[project]
name = "todo-backend"
version = "0.1.0"
description = "FastAPI task management API with optional AI and OAuth integrations"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi", "uvicorn", "sqlmodel", "alembic", "psycopg2-binary",
  "joserfc", "passlib[argon2,bcrypt]", "argon2-cffi>=23.1.0",
  "bcrypt<4.1", # passlib's legacy bcrypt verification requires the pre-4.1 API.
  "python-multipart", "pydantic-settings", "python-dotenv", "httpx",
  "authlib>=1.3.0", "requests", "itsdangerous",
  "openai>=1.50.0", "google-generativeai>=0.8.0",
  "dapr>=1.13.0", "dapr-ext-fastapi>=1.13.0", "kafka-python>=2.0.0",
  "sse-starlette>=2.0.0",
  "sentry-sdk>=2.0,<3",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "black", "pip-audit"]

[tool.uv]
package = false
